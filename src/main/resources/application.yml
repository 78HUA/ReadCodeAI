spring:
  application:
    name: readcodeai
  datasource:
    # 口令只从环境变量读，不进仓库：本机开发用 export READCODEAI_DB_PASSWORD=123456
    # rewriteBatchedStatements：让驱动把 batchUpdate 改写成多值 INSERT —— 不开它，
    # 一千次批处理仍然是一千次往返（实测十万行语料落库 13.5 秒，其中大头就是这个）
    url: jdbc:mysql://${READCODEAI_DB_HOST:127.0.0.1}:${READCODEAI_DB_PORT:3306}/readcodeai?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${READCODEAI_DB_USERNAME:root}
    password: ${READCODEAI_DB_PASSWORD:}
  sql:
    init:
      # schema.sql 全部是 CREATE TABLE IF NOT EXISTS，重复启动安全
      mode: always
  data:
    redis:
      # 只从环境变量读；没起 Redis 时会降级为"不缓存"，不影响问答本身
      host: ${READCODEAI_REDIS_HOST:127.0.0.1}
      port: ${READCODEAI_REDIS_PORT:6379}
      password: ${READCODEAI_REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      # 上传压缩包：真正的上限在 ProjectIndexer.MAX_UPLOAD_BYTES（那里会给出人话的错误），
      # 这里只是别让容器更早拒掉请求
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: 8080

readcodeai:
  llm:
    # 三样都给齐才会启用真实客户端；缺任何一样都降级为 Noop，且不影响静态分析能力
    enabled: true
    base-url: ${READCODEAI_LLM_BASE_URL:}
    # 密钥只从环境变量读，不落配置文件（.gitignore 也已挡住 application-local.*）
    api-key: ${READCODEAI_LLM_API_KEY:}
    model: ${READCODEAI_LLM_MODEL:}
    timeout-seconds: 60
    # 多跳检索的四维预算：轮次 / 时长 / token / 成本，任一超限即停
    # 轮次上限 8 = 最多查 6 跳 + 1 轮结论 + 1 轮保底（**最后一轮留给结论**，模型在这轮要求调工具就停机）
    max-rounds: 8
    # 提示词里保留多少跳的原始输出；更早的轮次压成一行事实（跳数+查到的名字+证据位置）
    # 设 0 = 不压缩（旧行为，A/B 对照与逃生门用）
    keep-full-observations: 2
    max-duration-ms: 60000
    max-estimated-tokens: 60000
    max-estimated-cost: 0.5
    # 计价参数（元/百万 token），只用于成本估算
    input-price-per-million: 0
    output-price-per-million: 0
  index:
    max-file-size-kb: 2048
    # 解析并行度：0 = 自动（核数与 8 取小），1 = 串行（并行改动的对照组，也是逃生门）
    parse-threads: 0
    # 远程仓库拉取后的存放目录（放在用户目录下，免得把下载的第三方代码混进项目工作区）
    workspace: ${user.home}/.readcodeai/repos
    exclude-patterns:
      - "**/target/**"
      - "**/build/**"
      - "**/generated/**"
  cache:
    # 答案缓存：同一个问题（同一份索引）第二次问时直接给上次的结果，不再花 10—40 秒与几千 token
    enabled: ${READCODEAI_CACHE_ENABLED:true}
    answer-ttl-minutes: 1440
  verify:
    # ③ 层核验（这段代码**支持**这条结论吗）—— ①② 层是程序化比对，不受这里影响、也关不掉
    # off = 不判定；mark = 判定并把"不支持"标出来（默认：判定会有误伤，不该因此丢掉整条答案）；reject = 判成不支持就拒答
    support-check: ${READCODEAI_SUPPORT_CHECK:mark}
  embedding:
    # 向量检索基线（第 3 层）：对比实验与"模糊语义查找"的接口位，**没有**接进问答路由
    # 与 LLM 共用 base-url / api-key（同一把 Key）；关掉只影响向量检索，索引与问答照常
    enabled: ${READCODEAI_EMBEDDING_ENABLED:true}
    model: ${READCODEAI_EMBEDDING_MODEL:embedding-3}
    # 实测 embedding-3 支持 dimensions 参数；1024 维比默认 2048 省一半内存
    dimensions: 1024
    batch-size: 16
  retrieve:
    top-k: 8
    # 不把整个仓库塞进上下文
    max-context-tokens: 30000
    # 同一个文件最多贡献几个代码块（防止热门文件霸占上下文）
    max-chunks-per-file: 3
